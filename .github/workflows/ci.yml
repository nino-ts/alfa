name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Docs subpaths match exports
        run: bun run verify:docs

      - name: Type-check
        run: bun run typecheck

      - name: Tests
        run: bun test

      - name: Lint
        run: bun run lint

      - name: llms-full.txt is up to date
        run: |
          bun run docs:build
          git diff --exit-code -- docs/llms-full.txt