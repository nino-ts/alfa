services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: alfa
    ports:
      - "5432:5432"
    volumes:
      - alfa-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d alfa"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  alfa-postgres:
